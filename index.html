<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Focus Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }
        
        .orb1 { 
            width: 500px; 
            height: 500px; 
            background: linear-gradient(45deg, #667eea, #764ba2);
            top: -200px; 
            left: -200px;
            animation-delay: 0s;
        }
        
        .orb2 { 
            width: 400px; 
            height: 400px; 
            background: linear-gradient(45deg, #f093fb, #f5576c);
            bottom: -150px; 
            right: -150px;
            animation-delay: 5s;
        }
        
        .orb3 { 
            width: 350px; 
            height: 350px; 
            background: linear-gradient(45deg, #4facfe, #00f2fe);
            top: 50%;
            left: 50%;
            animation-delay: 10s;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 100px) scale(0.9); }
        }

        .container { 
            position: relative;
            z-index: 1;
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 20px;
        }

        .status-banner {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            margin-bottom: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .status-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .status-banner.active {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(249, 115, 22, 0.2) 100%);
            border-color: rgba(239, 68, 68, 0.3);
            animation: pulse-glow 2s infinite;
        }

        .status-banner.clear {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.2) 100%);
            border-color: rgba(16, 185, 129, 0.3);
        }

        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 20px 60px rgba(239, 68, 68, 0.3),
                            0 0 40px rgba(239, 68, 68, 0.2);
            }
            50% { 
                box-shadow: 0 20px 80px rgba(239, 68, 68, 0.5),
                            0 0 60px rgba(239, 68, 68, 0.3);
            }
        }

        .banner-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 30px;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .status-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .status-banner.active .status-icon {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .status-text h1 {
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .status-text p {
            font-size: 22px;
            opacity: 0.9;
        }

        .status-cards {
            display: flex;
            gap: 15px;
        }

        .status-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px 25px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.2);
            min-width: 150px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .status-card-label {
            font-size: 13px;
            opacity: 0.8;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-card-value {
            font-size: 36px;
            font-weight: 900;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .stat-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .stat-icon {
            font-size: 28px;
        }

        .stat-value {
            font-size: 42px;
            font-weight: 900;
        }

        .stat-label {
            font-size: 15px;
            opacity: 0.7;
            font-weight: 600;
        }

        .add-task-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 25px;
            border-radius: 20px;
            color: white;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 40px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .add-task-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .task-form {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 40px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .form-title {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 18px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 17px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        select option {
            background: #1a1f3a;
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border-radius: 15px;
            border: none;
            font-weight: 800;
            cursor: pointer;
            font-size: 17px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        .section-title {
            font-size: 36px;
            font-weight: 900;
            margin: 50px 0 30px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-indicator {
            width: 6px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(180deg, #667eea, #764ba2);
        }

        .section-count {
            font-size: 24px;
            opacity: 0.4;
            font-weight: 600;
        }

        .task {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: flex-start;
            gap: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .task::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(180deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .task:hover {
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .task:hover::before {
            opacity: 1;
        }

        .task.high {
            border-color: rgba(239, 68, 68, 0.4);
        }

        .task.high::before {
            background: linear-gradient(180deg, #ef4444, #dc2626);
        }

        .task.medium {
            border-color: rgba(251, 191, 36, 0.4);
        }

        .task.medium::before {
            background: linear-gradient(180deg, #fbbf24, #f59e0b);
        }

        .task.low {
            border-color: rgba(59, 130, 246, 0.4);
        }

        .task.low::before {
            background: linear-gradient(180deg, #3b82f6, #2563eb);
        }

        .checkbox {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.3s ease;
            position: relative;
            margin-top: 3px;
        }

        .checkbox:hover {
            border-color: #667eea;
            transform: scale(1.1);
        }

        .checkbox.checked {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #10b981;
        }

        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .task-content {
            flex: 1;
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .priority-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .priority-badge.high {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .priority-badge.medium {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a1f3a;
        }

        .priority-badge.low {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .task-title {
            font-size: 20px;
            font-weight: 700;
            color: white;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 15px;
            opacity: 0.7;
            margin-top: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .progress-fill.high {
            background: linear-gradient(90deg, #ef4444, #dc2626);
        }

        .progress-fill.medium {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
        }

        .progress-fill.low {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            transform: translateY(-2px);
        }

        .completed .task-title {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .completed {
            opacity: 0.6;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .empty-text {
            font-size: 16px;
            opacity: 0.7;
        }

        .floating-alert {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            padding: 25px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(239, 68, 68, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            animation: bounce 2s infinite;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .alert-icon {
            font-size: 32px;
        }

        .alert-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .alert-title {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .alert-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .banner-content {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .status-cards {
                flex-direction: column;
                width: 100%;
            }

            .status-card {
                width: 100%;
            }

            .status-text h1 {
                font-size: 36px;
            }

            .section-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="container">
        <div id="statusBanner" class="status-banner clear">
            <div class="banner-content">
                <div class="banner-left">
                    <div class="status-icon" id="statusIcon">✨</div>
                    <div class="status-text">
                        <h1 id="statusTitle">ALL SYSTEMS GO!</h1>
                        <p id="statusSubtitle">Academic tasks completed! Time to unleash your creativity!</p>
                    </div>
                </div>
                <div class="status-cards">
                    <div class="status-card">
                        <div class="status-card-label">📚 Academic</div>
                        <div class="status-card-value" id="academicStatus">CLEAR</div>
                    </div>
                    <div class="status-card">
                        <div class="status-card-label">💻 Projects</div>
                        <div class="status-card-value" id="projectStatus">GO! 🚀</div>
                    </div>
                    <div class="status-card">
                        <div class="status-card-label">🏆 Done</div>
                        <div class="status-card-value" id="doneCount">0</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-card-top">
                    <span class="stat-icon">🎯</span>
                    <span class="stat-value" id="activeTasks">0</span>
                </div>
                <div class="stat-label">Active Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <span class="stat-icon">✅</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <span class="stat-icon">⚡</span>
                    <span class="stat-value" id="highPriority">0</span>
                </div>
                <div class="stat-label">High Priority</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-top">
                    <span class="stat-icon">📊</span>
                    <span class="stat-value" id="completionRate">0%</span>
                </div>
                <div class="stat-label">Completion Rate</div>
            </div>
        </div>

        <button class="add-task-btn" onclick="toggleForm()">+ ADD NEW ACADEMIC TASK</button>

        <div id="taskForm" class="task-form hidden">
            <div class="form-title">
                <span>➕</span>
                <span>New Task</span>
            </div>
            
            <div class="form-group">
                <input type="text" id="taskTitle" placeholder="Task title (e.g., Complete Machine Learning Assignment)">
            </div>

            <div class="form-group">
                <label class="form-label">Deadline</label>
                <input type="datetime-local" id="taskDeadline">
            </div>

            <div class="form-group">
                <label class="form-label">Priority Level</label>
                <select id="taskPriority">
                    <option value="high">🔴 High Priority</option>
                    <option value="medium">🟡 Medium Priority</option>
                    <option value="low">🔵 Low Priority</option>
                </select>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" onclick="addTask()">✓ Add Task</button>
                <button class="btn btn-secondary" onclick="toggleForm()">Cancel</button>
            </div>
        </div>

        <div id="pendingSection">
            <div class="section-title">
                <div class="section-indicator"></div>
                <span>PENDING TASKS</span>
                <span class="section-count" id="pendingCount">(0)</span>
            </div>
            <div id="pendingTasks"></div>
        </div>

        <div id="completedSection" class="hidden">
            <div class="section-title">
                <div class="section-indicator" style="background: linear-gradient(180deg, #10b981, #059669);"></div>
                <span>COMPLETED</span>
                <span class="section-count" id="completedCount">(0)</span>
            </div>
            <div id="completedTasksList"></div>
        </div>
    </div>

    <div id="floatingAlert" class="floating-alert hidden">
        <div class="alert-icon">⚠️</div>
        <div class="alert-text">
            <div class="alert-title">FOCUS MODE ACTIVE</div>
            <div class="alert-subtitle">Complete academic tasks first!</div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('academic_tasks') || '[]');

        function toggleForm() {
            document.getElementById('taskForm').classList.toggle('hidden');
        }

        function addTask() {
            const title = document.getElementById('taskTitle').value;
            if (!title.trim()) {
                alert('⚠️ Please enter a task title');
                return;
            }

            const task = {
                id: Date.now(),
                title: title,
                deadline: document.getElementById('taskDeadline').value,
                priority: document.getElementById('taskPriority').value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(task);
            saveTasks();
            
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDeadline').value = '';
            document.getElementById('taskPriority').value = 'high';
            
            toggleForm();
            render();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                render();
            }
        }

        function deleteTask(id) {
            if (confirm('🗑️ Delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                render();
            }
        }

        function saveTasks() {
            localStorage.setItem('academic_tasks', JSON.stringify(tasks));
        }

        function formatDeadline(deadline) {
            if (!deadline) return null;
            
            const date = new Date(deadline);
            const now = new Date();
            const diff = date - now;
            
            if (diff < 0) {
                return { text: '⚠️ Overdue', isOverdue: true, percentage: 0 };
            }
            
            const hours = Math.floor(diff / (1000 * 60 * 60));
            const days = Math.floor(hours / 24);
            const totalHours = diff / (1000 * 60 * 60);
            const percentage = Math.min(100, (totalHours / 168) * 100);
            
            let text = '';
            if (days > 0) {
                text = `⏰ ${days}d ${hours % 24}h remaining`;
            } else if (hours > 0) {
                text = `⏰ ${hours}h remaining`;
            } else {
                text = '⏰ Less than 1h';
            }
            
            return { text, isOverdue: false, percentage };
        }

        function render() {
            const pending = tasks.filter(t => !t.completed).sort((a, b) => {
                const order = { high: 0, medium: 1, low: 2 };
                return order[a.priority] - order[b.priority];
            });
            const completed = tasks.filter(t => t.completed);
            
            const banner = document.getElementById('statusBanner');
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const subtitle = document.getElementById('statusSubtitle');
